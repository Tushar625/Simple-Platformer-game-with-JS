<!DOCTYPE html>

<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<title>My First JS Game</title>
		<meta name="description" content="">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<style>

			body
			{
				height: 100dvh;
				width: 100dvw;
				margin: 0;
				padding: 0;
				
				/* place the game display in the center */
				
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.game
			{
				overflow: hidden;
				max-width: 600px;
				max-height: 450px;
				position: relative;
				/* border: 1px solid #000; */
			}
			
			.background
			{
				background: rgb(52, 166, 251);
				table-layout: fixed;
				border-spacing: 0;
			}

			.background td
			{
				padding: 0;
			}

			.lava
			{
				background: rgb(255, 100, 100);
			}

			.wall
			{
				background: white;
			}

			.actor
			{
				position: absolute;
			}
			
			.coin
			{
				background: rgb(241, 229, 89);
			}

			.player
			{
				background: rgb(64, 64, 64);
			}

			.lost .player
			{
				background: rgb(160, 64, 64);
			}

			.won .player
			{
				box-shadow:-4px-7px 8px white, 4px-7px 8px white;
			}
		</style>
		
	</head>
	<body>
		<!--[if lt IE 7]>
			<p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
		<![endif]-->


		
		<script async defer>

			// Vec class

			class Vec
			{
				constructor(x, y)
				{
					this.x = x
					this.y = y
				}

				plus(vec)
				{
					return new Vec(this.x + vec.x, this.y + vec.y)
				}

				times(factor)
				{
					return new Vec(this.x * factor, this.y * factor)
				}
			}

			// Actor classes

			class Player
			{
				constructor(pos, speed)
				{
					this.pos = pos
					this.speed = speed
				}

				get type()
				{
					return "player"
				}

				static create(pos)
				{
					return new Player(pos.plus(new Vec(0, -0.5)), new Vec(0, 0))
				}
			}

			Player.prototype.size = new Vec(0.8, 1.5)


			class Lava
			{
				constructor(pos, speed, reset)
				{
					this.pos = pos
					this.speed = speed
					this.reset = reset
				}

				get type()
				{
					return "lava"
				}

				static create(pos, ch)
				{
					if(ch == "=")
					{
						return new Lava(pos, new Vec(2, 0))
					}
					else if(ch == "|")
					{
						return new Lava(pos, new Vec(0, 2))
					}
					else if(ch == "v")
					{
						return new Lava(pos, new Vec(0, 3), pos)
					}
				}
			}

			Lava.prototype.size = new Vec(1, 1);


			class Coin
			{
				constructor(pos, basePos, wobble)
				{
					this.pos = pos
					this.basePos = basePos
					this.wobble = wobble
				}

				get type()
				{
					return "coin"
				}

				static create(pos)
				{
					let basePos = pos.plus(new Vec(0.2, 0.1))

					return new Coin(basePos, basePos, Math.random() * Math.PI * 2)
				}
			}

			Coin.prototype.size = new Vec(0.6, 0.6)


			// levelChars object maps plan characters to either background grid types or actor classes

			const levelChars = {
				".": "empty", "#": "wall", "+": "lava",
				"@": Player, "o": Coin,
				"=": Lava, "|": Lava, "v": Lava
			};


			// ==========================================================
			// Reads the level plan and generates a matrix of brick types
			// which are later used to draw the level
			// ==========================================================

			class Level
			{
				constructor(levelPlan)
				{
					// getting each line of level plan and converting them to array of characters

					let levelPlanMatrix = levelPlan.trim().split('\n').map(str => [...str])

					this.height = levelPlanMatrix.length

					this.width = levelPlanMatrix[0].length

					this.startActors = []
					
					// console.log(rows, this.height, this.width)

					// replacing each character of levelPlanMatrix with it's brick type

					this.matrix = levelPlanMatrix.map((row, y) => row.map((ch, x) => {
							
						if(typeof levelChars[ch] != 'string')
						{
							// ch is representing an actor

							this.startActors.push(levelChars[ch].create(new Vec(x, y), ch))

							// console.log(`(x, y) = (${x}, ${y})`)
							
							return "empty"
						}

						return levelChars[ch]
					}))

					// console.log(this.matrix)
				}
			}

			// new Level(simpleLevelPlan)


			class State
			{
				constructor(level, actors, status)
				{
					this.level = level
					this.actors = actors
					this.status = status
				}

				static start(level)
				{
					return new State(level, level.startActors, "playing")
				}

				get player()
				{
					return this.actors.find(actor => actor.type == "player")
				}
			}


			// ===============================
			// displaying everything on screen
			// ===============================


			// =================================================================
			// generates an element, adds attributes to it and child nodes to it
			// =================================================================

			function elt(elementName, attributes, ...children)
			{
				// create the element

				let elem = document.createElement(elementName)

				// attach attributes to the element

				Object.keys(attributes).forEach(attr => elem.setAttribute(attr, attributes[attr]))

				// attach children to the element

				children.forEach(child => elem.appendChild(child))

				return elem
			}

			// document.body.appendChild(elt("p", {class: "lava"}, document.createTextNode("I hate you")))

			const scale = 20

			// ============================================================================================
			// draws a table depicting the level, each cell of this table represents a cell of level.matrix
			// these cells are assigned classes according to their brick types
			// ============================================================================================

			function drawGrid(level)
			{
				return elt("table", {class: "background", style: `width: ${level.width * scale}px`}, ...level.matrix.map(row => elt("tr", {style: `height: ${scale}px`}, ...row.map(cellType => elt("td", {class: cellType})))))
			}


			function drawActors(actors)
			{
				return elt("div", {}, ...actors.map(actor => {
					
					// console.log(actor)

					let actorElem = elt("div", {"class" : `actor ${actor.type}`})

					actorElem.style.width = actor.size.x * scale + "px"

					actorElem.style.height = actor.size.y * scale + "px"

					actorElem.style.left = actor.pos.x * scale + "px"

					actorElem.style.top = actor.pos.y * scale + "px"

					return actorElem
				}))
			}


			// document.body.appendChild(drawGrid(new Level(simpleLevelPlan)))

			// =====================================================================================
			// prints the level inside a 'div' and appends to a parent, can delete the 'div' (level)
			// =====================================================================================

			class GameDisplay
			{
				constructor(parent, level)
				{
					this.gameDOM = elt("div", {class: "game"}, drawGrid(level))

					this.actorLayer = null

					parent.appendChild(this.gameDOM)
				}

				clear()
				{
					this.gameDOM.remove()
				}
			}


			GameDisplay.prototype.stateDisplay = function(state)
			{
				if(this.actorLayer)
				{
					this.actorLayer.remove()
				}

				this.actorLayer = drawActors(state.actors)

				this.gameDOM.appendChild(this.actorLayer)

				this.gameDOM.className = "game " + state.status

				this.scrollPlayerIntoView(state)
			}


			GameDisplay.prototype.scrollPlayerIntoView = function(state) 
			{
				// getting size of the view port

				let width = this.gameDOM.clientWidth
				
				let height = this.gameDOM.clientHeight

				let margin = new Vec(width / 3, width / 3)

				// player center (we make sure a (margin x margin) square around this center remains visible all the time)

				let center = state.player.pos.plus(state.player.size.times(.5)).times(scale)

				// positioning viewport

				// left right

				if(center.x - margin.x < this.gameDOM.scrollLeft)
				{
					this.gameDOM.scrollLeft = center.x - margin.x
				}
				else if(center.x + margin.x > this.gameDOM.scrollLeft + this.gameDOM.clientWidth)
				{
					this.gameDOM.scrollLeft = center.x + margin.x - this.gameDOM.clientWidth
				}

				// top bottom

				if(center.y - margin.y < this.gameDOM.scrollTop)
				{
					this.gameDOM.scrollTop = center.y - margin.y
				}
				else if(center.y + margin.y > this.gameDOM.scrollTop + this.gameDOM.clientHeight)
				{
					this.gameDOM.scrollTop = center.y + margin.y - this.gameDOM.clientHeight
				}
			};


			// ===================
			// Collision detection
			// ===================


			// detects if an actor (described by pos, size) touching any non actor level elements of level


			Level.prototype.touch = function(pos, size, touch_target_type)
			{
				start_x = Math.floor(pos.x)

				end_x = Math.ceil(pos.x + size.x)

				start_y = Math.floor(pos.y)

				end_y = Math.ceil(pos.y + size.y)

				for(let y = start_y; y < end_y; y++)
				{
					for(let x = start_x; x < end_x; x++)
					{
						if((y < 0 || y >= this.height || x < 0 || x >= this.width) && (touch_target_type == "wall"))
						{
							// any grid out of level bounds is considered wall

							return true
						}

						if(touch_target_type == this.matrix[y][x])
						{
							return true
						}
					}
				}

				return false
			}


			// aabb collision detection between actors


			function overlap(actor1, actor2)
			{
				return actor1.pos.x + actor1.size.x > actor2.pos.x &&
				actor1.pos.x < actor2.pos.x + actor2.size.x &&
				actor1.pos.y + actor1.size.y > actor2.pos.y &&
				actor1.pos.y < actor2.pos.y + actor2.size.y;
			}


			// actor specific collision resolution functions that affects the game state


			Lava.prototype.player_collision_resolution = function(state)
			{
				return new State(state.level, state.actors, "lost")
			}


			Coin.prototype.player_collision_resolution = function(state)
			{
				// delete the coin

				let actors = state.actors.filter(actor => actor != this)

				if(actors.some(actor => actor.type == "coin"))
				{
					// still some coins left

					return new State(state.level, actors, state.status)
				}
				else
				{
					// no coins left

					return new State(state.level, actors, "won")
				}
			}


			// =============
			// tracking Keys
			// =============


			let key_tracker = Object.create(null)


			key_tracker.up = false

			key_tracker.left = false

			key_tracker.right = false


			let key_track = function(event)
			{
				val = event.type == "keydown"

				if(event.key == "ArrowUp")
				{
					if(val && key_tracker.up != "jumped")
					{
						key_tracker.up = true
					}
					else if(val == false)
					{
						key_tracker.up = false
					}
				}
				else if(event.key == "ArrowLeft")
				{
					key_tracker.left = val
				}
				else if(event.key == "ArrowRight")
				{
					key_tracker.right = val
				}

				if(event.key == "ArrowUp" || event.key == "ArrowLeft" || event.key == "ArrowRight")
				{	
					event.preventDefault()
				}
			}


			window.addEventListener("keydown", key_track)

			window.addEventListener("keyup", key_track)


			// ======
			// update
			// ======


			// Lava update

			Lava.prototype.update = function(dt, state)
			{
				// calculating next position of the lava
				
				let next_pos = this.pos.plus(this.speed.times(dt))

				if(state.level.touch(next_pos, this.size, "wall"))
				{
					// lava is touching a wall

					if(this.reset)
					{
						// this is vertically dropping lava, reset it to the top, i.e., it's reset position

						return new Lava(this.reset, this.speed, this.reset)
					}
					else
					{
						// this is horizontally moving lava so we change it's direction after collision

						return new Lava(this.pos, this.speed.times(-1))
					}
				}

				// keep Lava moving

				return new Lava(next_pos, this.speed, this.reset)
			}


			// coin update

			const wobbleSpeed = 8, wobbleDist = 0.07;

			Coin.prototype.update = function(time)
			{
				let wobble = this.wobble + time * wobbleSpeed;
				let wobblePos = Math.sin(wobble) * wobbleDist;
				return new Coin(this.basePos.plus(new Vec(0, wobblePos)), this.basePos, wobble);
			};


			// player update

			const playerXSpeed = 7;
			const gravity = 30;
			const jumpSpeed = 17;

			Player.prototype.update = function(dt, state)
			{
				let pos = this.pos

				// horizontal movement

				if(key_tracker.left || key_tracker.right)
				{
					let x_speed = key_tracker.left ? -playerXSpeed : playerXSpeed
					
					let next_pos = pos.plus(new Vec(x_speed * dt, 0))

					if(!state.level.touch(next_pos, this.size, "wall"))
					{
						// the player is not touching any wall

						pos = next_pos
					}
				}

				// vertical movement

				let y_speed = this.speed.y + gravity * dt

				let next_pos = pos.plus(new Vec(0, y_speed * dt))

				if(!state.level.touch(next_pos, this.size, "wall"))
				{
					// the player is not touching any wall, i.e, player is in free fall

					pos = next_pos
				}
				else if(key_tracker.up === true && y_speed > 0)
				{
					// player is falling and hitting something, this means, he could be standing on the platform
					// make him jump

					y_speed = -jumpSpeed

					key_tracker.up = "jumped"
				}
				else
				{
					// player is standing peacefully on the platform or just bumped his head on a roof platform

					y_speed = 0
				}

				return new Player(pos, new Vec(0, y_speed))
			}


			// game update


			State.prototype.update = function(dt)
			{
				let new_actors = this.actors.map(actor => actor.update(dt, this))

				let new_state = new State(this.level, new_actors, this.status)

				if(this.status != "playing")
				{
					return this
				}

				// check if the player touches nonactor Lava

				if(new_state.level.touch(new_state.player.pos, new_state.player.size, 'lava'))
				{
					return new State(this.level, new_actors, "lost")
				}

				// check if player touches anyother actors

				for(let actor of new_actors)
				{
					if(actor != new_state.player && overlap(actor, new_state.player))
					{
						// player collides with an actor

						new_state = actor.player_collision_resolution(new_state)
					}
				}

				return new_state
			}


			// run the game


			function run(update)
			{
				let old_time_stamp = null

				function runner(new_time_stamp)
				{
					if(old_time_stamp != null)
					{
						let dt = Math.min(new_time_stamp - old_time_stamp, 100) / 1000

						if(update(dt) === false)
						{
							return
						}
					}

					old_time_stamp = new_time_stamp

					requestAnimationFrame(runner)
				}

				requestAnimationFrame(runner)
			}


			// level update

			// const levelChars = {
			// 	".": "empty", "#": "wall", "+": "lava",
			// 	"@": Player, "o": Coin,
			// 	"=": Lava, "|": Lava, "v": Lava
			// };


			let level_plans = [
`......................
..#.=..............#..
..#................#..
..#.........o.o....#..
..#.@......#####...#..
..#####............#..
......#++++++++++++#..
......##############..
......................`,
`
.......................#+#............................
........................v.............................
...........................o..o...............|.......
..........................######......................
..=..................................o................
..................................#######.............
.................o...o......................o...o.....
................#######.......o..o..o......#######....
.....@......................###########...............
...#########..........................................
.................o...o................................
...............#########..............................
......................................................
.............o........................................
..........#######.....................................
++++++++++++++++++++++++++++++++++++++++++++++++++++++`
];


			// this function updates the state (moves the actors), renders the actors and the background, i.e., walls

			function run_level(level_i)
			{
				// load the level into level object, it keeps the static parts (walls) and actors seperately

				let level = new Level(level_plans[level_i])

				// we create a GameDisplay object that displays the static elements of the level

				let gameDisplayObj = new GameDisplay(document.body, level)

				// getting the starting state object, i.e., initial position of the actors
				
				let state = State.start(level)

				// after the game is over (won / lost) we keep displaying the level for a while

				let game_end_timer = 1

				// display the actors

				gameDisplayObj.stateDisplay(state)

				// we use promise because "requestAnimationFrame()" is async function, it doesn't stop the execution while
				// displaying the frame
				// this promise runs the level recursively with "run()" and resolves when the the level is either lost or won
				// then it executes the callback of then(), that function either finishes the game with an alert or starts the
				// next level if won, or restarts the same level if lost
					
				let level_promise = new Promise(resolve => {

					// run() takes an update(dt) function and runs it recursively untill the update() returns false

					run(dt => {

						// update() state
				
						state = state.update(dt)

						// display newly updated actors

						gameDisplayObj.stateDisplay(state)

						// check new status of the game after update

						if(state.status == "playing")
						{
							// keep playing

							return true
						}
						else if(game_end_timer > 0)
						{
							// game is over (won/lost) wait for game_end_timer seconds

							game_end_timer -= dt

							return true
						}
						else
						{
							// waiting time is over, destroy gamedom, gamedom contains the static level (walls) and actor elements

							gameDisplayObj.clear()

							// now the promise can resolve and the callback of then gets called with the state status

							resolve(state.status)

							// stop run()

							return false
						}
					})
				})

				// the callback function of then() either finishes the game with an alert or starts the
				// next level if won, or restarts the same level if lost

				level_promise.then( status => {

					if(status == "won")
					{
						level_i++

						if(level_i < level_plans.length)
						{
							run_level(level_i)
						}
						else
						{
							alert("~~~~ You Won ~~~~")
						}
					}
					else
					{
						run_level(level_i)
					}
				})
			}

			// start the game from first level

			run_level(0)

		</script>
	</body>
</html>
